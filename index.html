<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeO</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f172a;
    color:white;
}

/* LEFT MENU */
.sidebar {
    width:220px;
    height:100vh;
    position:fixed;
    background:#111827;
    padding:20px;
}

.logo {
    font-size:28px;
    font-weight:bold;
    color:#00f2fe;
}

.menu a {
    display:block;
    margin-top:20px;
    color:#aaa;
    text-decoration:none;
}

.menu a:hover {
    color:#00f2fe;
}

/* MAIN */
.main {
    margin-left:240px;
    padding:20px;
}

/* VIDEO */
.video {
    height:300px;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    font-size:50px;
}

/* CHAT */
.chat {
    margin-top:20px;
    background:#111;
    padding:10px;
    border-radius:10px;
}

.msg {
    padding:8px;
    margin:5px;
    border-radius:8px;
}

.received {background:#333;}
.sent {background:#00f2fe; color:black; text-align:right;}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">VibeO</div>
    <div class="menu">
        <a href="#">🏠 Home</a>
        <a href="#">🔍 Search</a>
        <a href="#">💬 Chat</a>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="video">🎬</div>
    <h2>Video title</h2>
    <p>@author</p>

    <button onclick="like()">❤️ Like (<span id="count">0</span>)</button>

    <!-- CHAT -->
    <div class="chat" id="chatBox">
        <div class="msg received">Salom 👋</div>
    </div>

    <input type="text" id="msgInput" placeholder="Xabar yoz...">
    <button onclick="sendMsg()">Yuborish</button>

</div>

<script>
let c = 0;

function like(){
    c++;
    document.getElementById("count").innerText = c;
}

function sendMsg(){
    let text = document.getElementById("msgInput").value;

    if(text.trim() === "") return;

    let div = document.createElement("div");
    div.className = "msg sent";
    div.innerText = text;

    document.getElementById("chatBox").appendChild(div);
    document.getElementById("msgInput").value = "";
}
</script>

</body>
</html>
