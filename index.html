<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeO Register</title>

<style>
@keyframes bgMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(-45deg, #020617, #020617, #020617, #020617);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 40px;
    width: 340px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
}

/* TITLE */
.card h2 {
    color: #38bdf8;
    margin-bottom: 10px;
}

.card p {
    color: #9ca3af;
    font-size: 14px;
    margin-bottom: 25px;
}

/* INPUT */
.input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.08);
    color: white;
    outline: none;
    font-size: 14px;
}

.input:focus {
    border-color: #38bdf8;
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #22d3ee, #3b82f6);
    color: #000;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
}

.btn:hover {
    opacity: 0.9;
}
</style>

</head>

<body>

<div class="card">
    <h2>Регистрация в VibeO</h2>
    <p>Создайте всемирный аккаунт</p>

    <input type="email" class="input" placeholder="Ваш G-mail">
    <input type="text" class="input" placeholder="Придумайте никнейм">
    <input type="text" class="input" placeholder="Номер телефона">

    <button class="btn" onclick="register()">Создать аккаунт</button>
</div>

<script>
function register(){
    alert("Аккаунт создан ✅");
}
</script>

</body>
</html>
